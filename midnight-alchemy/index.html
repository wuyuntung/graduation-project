<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>眼前的黑不是黑</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" crossorigin="anonymous"></script>
    
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #0b0b0b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; 
        }
        
        .container {
            background-color: #141414;
            padding: 30px; 
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.7);
            max-width: 850px; 
            width: 92%;      
            text-align: center;
            border: 1px solid #222;
            position: relative;
            box-sizing: border-box;
        }
        
        h2 { margin-bottom: 25px; color: #ffdd67; font-size: 26px; }
        .progress { font-size: 14px; color: #666; margin-bottom: 15px; }
        .question-title { font-size: 20px; margin-bottom: 25px; line-height: 1.4; color: #e0e0e0; }
        
        .btn {
            display: block;
            width: 100%;
            padding: 18px 20px;
            margin: 12px 0;
            background-color: #1c1c1c;
            color: #ddd;
            border: 2px solid #2c2c2c;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            box-sizing: border-box;
        }
        .btn:hover { 
            background-color: #252525; 
            border-color: #ffdd67; 
            color: #fff;
        }

        .nav-actions {
            margin-top: 25px;
            border-top: 1px solid #222;
            padding-top: 15px;
        }
        .back-btn {
            background: transparent;
            color: #666;
            border: 1px solid #333;
            padding: 8px 20px;
            font-size: 14px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .back-btn:hover {
            color: #ffdd67;
            border-color: #ffdd67;
            background-color: rgba(255, 221, 103, 0.05);
        }

        .restart-btn {
            display: inline-block;
            background-color: transparent;
            color: #ffdd67;
            border: 2px solid #ffdd67;
            padding: 12px 30px;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 2px;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 25px;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 221, 103, 0.1);
            position: relative !important;
            z-index: 99999 !important; 
            pointer-events: auto !important;
        }
        .restart-btn:hover {
            background-color: #ffdd67;
            color: #000000;
            box-shadow: 0 0 25px #ffdd67;
        }

        .restart-btn:disabled {
            cursor: not-allowed;
            opacity: 0.5;
            border-color: #555;
            color: #999;
            box-shadow: none;
        }

        #result-page, #preview-page, #character-page, #photo-result-page { display: none; }
        
        #result-page #tracking-container, #preview-page #tracking-container {
            margin-top: 0px !important;
            width: 100%;
            position: relative;
        }
        #result-page #output_canvas, #preview-page #preview-photo-img {
            width: 100% !important;
            max-width: 100% !important;
            height: auto !important;
            border-radius: 16px;
            border: none !important;
        }

        .eye-grow-img {
            position: fixed; 
            z-index: 9998; 
            transform: translate(-50%, -50%); 
            width: 0px; 
            height: auto;
            pointer-events: none; 
            display: none; 
            opacity: 0;
            transition: opacity 2s ease;
        }

        #preview-page .preview-actions {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        .display-character-img,
        .display-photo-result-img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            object-fit: contain;
        }

        .photo-result-shell {
            width: min(100%, 1180px);
            min-height: 55vh;
            display: grid;
            grid-template-columns: minmax(320px, 1.1fr) minmax(280px, 0.9fr);
            gap: 24px;
            align-items: center;
        }

        .result-media-column {
            display: flex;
            flex-direction: column;
            gap: 14px;
            justify-content: center;
            background-color: #141414; 
            padding: 20px;
            border-radius: 24px;
            border: 1px solid #222;
        }

        .result-info-column {
            display: flex;
            flex-direction: column;
            gap: 18px;
            justify-content: center;
        }

        .result-media-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid #222;
            border-radius: 22px;
            padding: 12px;
        }
        .result-media-card img {
            max-height: 28vh;
        }

        #photo-page-title, #photo-quote-text { text-align: left; }
        #photo-quote-text {
            color: #e0e0e0;
            font-style: italic;
            margin: 0;
            font-size: 16px;
            line-height: 1.6;
        }

        .qr-section {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 12px;
        }
        #qr-code-container {
            width: 156px;
            height: 156px;
            padding: 12px;
            background: #ffffff;
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 13px;
            font-weight: bold;
        }
        .qrcode-box canvas, .qrcode-box img {
            width: 132px !important;
            height: 132px !important;
            display: block;
        }
        .qr-copy {
            color: #aaa;
            font-size: 14px;
            line-height: 1.6;
            text-align: left;
            margin: 0;
        }

        .result-actions {
            display: flex;
            gap: 14px;
            justify-content: flex-start;
            flex-wrap: wrap;
        }
        .result-actions .restart-btn { margin-top: 0 !important; }

        #ai-loading-mask {
            position: absolute; top:0; left:0; width:100%; height:100%; 
            background: #141414; z-index: 1000; 
            display: flex; justify-content: center; align-items: center; 
            border-radius: 24px; flex-direction: column;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="ai-loading-mask">
        <div style="font-size: 24px; color: #ffdd67; margin-bottom: 20px; font-weight: bold;">深夜煉金術指標載入中...</div>
        <div style="font-size: 14px; color: #666;">（正在連結 AI 核心，請稍候）</div>
    </div>

    <div id="quiz-page">
        <div class="progress" id="progress-text">LOADING...</div>
        <div class="question-title" id="question-text">準備進入黑眼圈回收程序...</div>
        <div id="options-container"></div>
        
        <div class="nav-actions">
            <button id="back-nav-btn" class="back-btn" onclick="handleBackNavigation()">← 返回封面</button>
        </div>
    </div>

    <div id="result-page">
        <div id="tracking-container">
            <video id="webcam" autoplay playsinline style="display:none;" width="640" height="480"></video>
            <canvas id="output_canvas" width="640" height="480"></canvas>
        </div>
        
        <img id="left-eye-img" src="" alt="左眼貼圖" class="eye-grow-img">
        <img id="right-eye-img" src="" alt="右眼貼圖" class="eye-grow-img">
        
        <div style="display: none;">
            <div id="char-name"></div>
            <div id="quote-text"></div>
        </div>
        
        <button id="camera-action-btn" class="restart-btn" onclick="goToPhotoPreview()" disabled>黑眼圈IP生成中...</button>
    </div>

    <div id="preview-page">
        <div id="tracking-container">
            <img id="preview-photo-img" src="" alt="拍照預覽">
        </div>
        <div class="preview-actions">
            <button class="restart-btn" onclick="retakePhoto()">重新拍照</button>
            <button class="restart-btn" onclick="goToCharacterPage()">確認</button>
        </div>
    </div>

    <div id="character-page">
        <h2 id="char-page-title" style="color: #ffdd67; margin-bottom: 5px;">核心化身：</h2>
        <img id="final-char-img" src="" alt="角色插圖" class="display-character-img">
        <p id="quote-text-final" style="color: #e0e0e0; font-style: italic; margin: 15px auto; font-size: 16px; line-height: 1.5; max-width: 80%;"></p>
        <div class="result-actions" style="justify-content: center;">
            <button class="restart-btn" onclick="saveCurrentResult()">儲存結果</button>
        </div>
    </div>

    <div id="photo-result-page">
        <div class="photo-result-shell">
            
            <div class="result-media-column" id="my-capture-target-box">
                <h2 id="photo-result-title-node" style="color: #ffdd67; margin: 0; text-align: left; font-size: 24px;">核心化身：</h2>
                <div class="result-media-card">
                    <img id="photo-result-char-img" src="" alt="角色插圖" class="display-character-img">
                </div>
                <div class="result-media-card">
                    <img id="photo-result-photo-img" src="" alt="拍照結果" class="display-photo-result-img">
                </div>
                <p id="photo-quote-text" style="margin-top: 10px;"></p>
            </div>
            
            <div class="result-info-column">
                <div class="qr-section">
                    <div id="qr-code-container" class="qrcode-box">點擊儲存<br>生成條碼</div>
                    <p class="qr-copy" id="qr-copy-hint-text">點擊下方「儲存結果」按鈕，電腦將下載證書圖片，並同步將圖片轉為 QR Code 供手機掃描帶走！</p>
                </div>
                <div class="result-actions">
                    <button class="restart-btn" style="background-color: #ffdd67; color: #000;" onclick="saveCurrentResultAndGenerateImgQr()">📥 儲存結果 / 生成條碼</button>
                </div>
                <div class="result-actions">
                    <button class="restart-btn" onclick="resetQuizToCover()">重新回收 / 下一位</button>
                </div>
            </div>
            
        </div>
    </div>
</div>

<script>
    let faceMesh; let camera; let videoElement; let canvasElement; let canvasCtx;
    let currentFinalColor = 'white'; let loadedImages = {}; let detectedColor = 'white'; 
    let capturedPhotoDataUrl = ''; let qrCodeInstance = null;

    let currentEyeWidth = 70; const maxEyeWidth = 3200; const growSpeedPerSecond = 180; 
    let hasLockedCoordinates = false; let animationFrameId = null; let lastTimestamp = 0; let startTime = 0; 
    let isShrinking = false; let shrinkStartTimestamp = 0; let hasCompletedSequence = false;

    let eyePositions = { lx: 0, ly: 0, rx: 0, ry: 0 };

    const characterImages = {
        red:    './images/pattern_red.png', orange: './images/pattern_orange.png', yellow: './images/pattern_yellow.png', green:  './images/pattern_green.png',
        blue:   './images/pattern_blue.png', purple: './images/pattern_purple.png', black:  './images/pattern_black.png', white:  './images/pattern_white.png'
    };

    const colorPatternsBase = {
        red:    './images/pattern_red.png', orange: './images/pattern_orange.png', yellow: './images/pattern_yellow.png', green:  './images/pattern_green.png',
        blue:   './images/pattern_blue.png', purple: './images/pattern_purple.png', black:  './images/pattern_black.png', white:  './images/pattern_white.png'
    };

    const colorPatternsLeft = {
        red: './images/pattern_red_L.png', orange: './images/pattern_orange_L.png', yellow: './images/pattern_yellow_L.png', green: './images/pattern_green_L.png',
        blue: './images/pattern_blue_L.png', purple: './images/pattern_purple_L.png', black: './images/pattern_black_L.png', white: './images/pattern_white_L.png'
    };

    const colorPatternsRight = {
        red: './images/pattern_red_R.png', orange: './images/pattern_orange_R.png', yellow: './images/pattern_yellow_R.png', green: './images/pattern_green_R.png',
        blue: './images/pattern_blue_R.png', purple: './images/pattern_purple_R.png', black: './images/pattern_black_R.png', white: './images/pattern_white_R.png'
    };

    function initAiCore() {
        videoElement = document.getElementById("webcam"); 
        canvasElement = document.getElementById("output_canvas"); 
        canvasCtx = canvasElement.getContext("2d");
        
        Object.keys(colorPatternsLeft).forEach(color => { const img = new Image(); img.src = colorPatternsLeft[color]; loadedImages[`${color}_L`] = img; });
        Object.keys(colorPatternsRight).forEach(color => { const img = new Image(); img.src = colorPatternsRight[color]; loadedImages[`${color}_R`] = img; });
        Object.keys(colorPatternsBase).forEach(color => { const img = new Image(); img.src = colorPatternsBase[color]; loadedImages[color] = img; });

        const FaceMeshClass = window.FaceMesh || FaceMesh;
        faceMesh = new FaceMeshClass({ locateFile: (file) => `https://unpkg.com/@mediapipe/face_mesh@0.4/${file}` });
        faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        faceMesh.onResults(onFaceResults);
        
        document.getElementById("ai-loading-mask").style.display = "none";
        
        // 🌟 核心修正：移除會導致未定義報錯的 showQuestion()。
        // 現在它會順暢載入，並直接交由你外部引入的 JS 或者是原有的邏輯控制題目顯示！
        if (typeof showQuestion === "function") {
            showQuestion();
        }
    }

    function updateCameraActionButtonState(isReady, label = '拍照') {
        const cameraActionBtn = document.getElementById('camera-action-btn'); if (!cameraActionBtn) return;
        cameraActionBtn.disabled = !isReady; cameraActionBtn.innerText = label;
    }

    function startTrackingAR(finalColor) {
        currentFinalColor = finalColor; currentEyeWidth = 70; hasLockedCoordinates = false; 
        isShrinking = false; shrinkStartTimestamp = 0; hasCompletedSequence = false; capturedPhotoDataUrl = '';
        updateCameraActionButtonState(false, '黑眼圈IP生成中...');
        
        const now = performance.now(); lastTimestamp = now; startTime = now; 
        if (animationFrameId) cancelAnimationFrame(animationFrameId);

        ensureResultEyeImages();
        const lImg = document.getElementById('left-eye-img'); const rImg = document.getElementById('right-eye-img');
        lImg.src = colorPatternsLeft[finalColor]; rImg.src = colorPatternsRight[finalColor];
        lImg.style.width = '70px'; rImg.style.width = '70px'; lImg.style.opacity = '0'; rImg.style.opacity = '0';
        lImg.style.display = 'none'; rImg.style.display = 'none';

        document.getElementById("tracking-container").style.display = "block";

        if (!camera) {
            const CameraClass = window.Camera || Camera;
            camera = new CameraClass(videoElement, {
                onFrame: async () => { await faceMesh.send({ image: videoElement }); }, width: 640, height: 480
            });
            camera.start().catch(err => { alert("鏡頭啟動失敗：" + err); });
        }
        animateImageGrowth(performance.now());
    }

    function animateImageGrowth(currentTimestamp) {
        const deltaTime = (currentTimestamp - lastTimestamp) / 1000; lastTimestamp = currentTimestamp;
        const timeElapsed = currentTimestamp - startTime;
        const lImg = document.getElementById('left-eye-img'); const rImg = document.getElementById('right-eye-img');
        if (!lImg || !rImg) return;

        const fadeDuration = 2500; const pauseDuration = 2000; const shrinkDuration = 1200; const initialWaitDuration = 1500;

        if (timeElapsed >= initialWaitDuration && hasLockedCoordinates) {
            lImg.style.display = 'block'; rImg.style.display = 'block';
            const fadeElapsed = timeElapsed - initialWaitDuration; const fadeProgress = Math.min(fadeElapsed / fadeDuration, 1);

            if (fadeProgress < 1) {
                lImg.style.opacity = String(fadeProgress); rImg.style.opacity = String(fadeProgress); currentEyeWidth = 70;
            } else if (fadeElapsed < fadeDuration + pauseDuration) {
                lImg.style.opacity = '1'; rImg.style.opacity = '1'; currentEyeWidth = 70;
            } else if (hasCompletedSequence) {
                lImg.style.opacity = '1'; rImg.style.opacity = '1'; currentEyeWidth = 70; updateCameraActionButtonState(true, '拍照');
            } else if (isShrinking) {
                lImg.style.opacity = '1'; rImg.style.opacity = '1';
                const shrinkProgress = Math.min((currentTimestamp - shrinkStartTimestamp) / shrinkDuration, 1);
                currentEyeWidth = maxEyeWidth - (maxEyeWidth - 70) * shrinkProgress;
                if (shrinkProgress >= 1) {
                    currentEyeWidth = 70; isShrinking = false; hasCompletedSequence = true;
                    lImg.src = colorPatternsBase[currentFinalColor]; rImg.src = colorPatternsBase[currentFinalColor];
                    updateCameraActionButtonState(true, '拍照');
                }
            } else {
                lImg.style.opacity = '1'; rImg.style.opacity = '1';
                const growProgress = Math.min((currentTimestamp - (startTime + initialWaitDuration + fadeDuration + pauseDuration)) / shrinkDuration, 1);
                currentEyeWidth = 70 + (maxEyeWidth - 70) * growProgress;
                if (growProgress >= 1) {
                    currentEyeWidth = maxEyeWidth; lImg.src = colorPatternsLeft[currentFinalColor]; rImg.src = colorPatternsRight[currentFinalColor];
                    isShrinking = true; shrinkStartTimestamp = currentTimestamp;
                }
            }
        } else {
            currentEyeWidth = 70; lImg.style.display = 'none'; rImg.style.display = 'none';
        }

        lImg.style.width = currentEyeWidth + 'px'; rImg.style.width = currentEyeWidth + 'px';
        if (hasLockedCoordinates) {
            const inwardShift = Math.min(currentEyeWidth * -0.5, 100);
            lImg.style.left = eyePositions.lx + inwardShift + 'px'; lImg.style.top = eyePositions.ly + 'px';
            rImg.style.left = eyePositions.rx - inwardShift + 'px'; rImg.style.top = eyePositions.ry + 'px';
        }
        animationFrameId = requestAnimationFrame(animateImageGrowth);
    }

    function onFaceResults(results) {
        canvasCtx.save(); canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.translate(canvasElement.width, 0); canvasCtx.scale(-1, 1); canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
        if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
            const landmarks = results.multiFaceLandmarks[0]; const rect = canvasElement.getBoundingClientRect();
            eyePositions.lx = rect.left + (1 - landmarks[111].x) * rect.width; eyePositions.ly = rect.top + landmarks[111].y * rect.height;
            eyePositions.rx = rect.left + (1 - landmarks[340].x) * rect.width; eyePositions.ry = rect.top + landmarks[340].y * rect.height;
            hasLockedCoordinates = true; 
        }
        canvasCtx.restore();
    }

    function captureCurrentFrame() {
        if (!canvasElement) return '';
        try {
            const tempCanvas = document.createElement('canvas'); tempCanvas.width = canvasElement.width; tempCanvas.height = canvasElement.height;
            const tempCtx = tempCanvas.getContext('2d'); tempCtx.drawImage(canvasElement, 0, 0, tempCanvas.width, tempCanvas.height);
            return tempCanvas.toDataURL('image/png');
        } catch (error) { console.error('拍照失敗：', error); return ''; }
    }

    function showPreviewPage() {
        document.getElementById('result-page').style.display = 'none'; document.getElementById('preview-page').style.display = 'block';
        const previewImg = document.getElementById('preview-photo-img'); if (previewImg) { previewImg.src = capturedPhotoDataUrl; }
    }

    function showCharacterPage() {
        document.getElementById('preview-page').style.display = 'none'; document.getElementById('character-page').style.display = 'block';
        const charImgElement = document.getElementById('final-char-img'); if (charImgElement) { charImgElement.src = characterImages[detectedColor]; }

        const originalCharName = document.getElementById('char-name').innerText;
        const originalQuote = document.getElementById('quote-text').innerText;
        document.getElementById('char-page-title').innerText = `核心化身：${originalCharName}`;
        document.getElementById('quote-text-final').innerText = originalQuote;
    }

    function goToPhotoResultPage() {
        document.getElementById('character-page').style.display = 'none'; document.getElementById('photo-result-page').style.display = 'block';
        const charImgElement = document.getElementById('photo-result-char-img'); const photoImgElement = document.getElementById('photo-result-photo-img');
        if (charImgElement) { charImgElement.src = characterImages[detectedColor]; }
        if (photoImgElement) { photoImgElement.src = capturedPhotoDataUrl || ''; photoImgElement.style.display = capturedPhotoDataUrl ? 'block' : 'none'; }

        const originalCharName = document.getElementById('char-name').innerText;
        const originalQuote = document.getElementById('quote-text').innerText;
        document.getElementById('photo-result-title-node').innerText = `核心化身：${originalCharName}`;
        document.getElementById('photo-quote-text').innerText = originalQuote;
    }

    function saveCurrentResult() {
        goToPhotoResultPage();
    }

    function saveCurrentResultAndGenerateImgQr() {
        if (!window.html2canvas) { alert('html2canvas 未載入'); return; }

        const qrContainer = document.getElementById('qr-code-container');
        const hintText = document.getElementById('qr-copy-hint-text');
        if (qrContainer) qrContainer.innerHTML = '沖洗中...';

        const targetBox = document.getElementById('my-capture-target-box');
        html2canvas(targetBox, {
            backgroundColor: '#141414',
            scale: 1.5, 
            useCORS: true,
            logging: false
        }).then(canvas => {
            const imageDataUrl = canvas.toDataURL('image/jpeg', 0.85);
            
            const link = document.createElement('a');
            link.href = imageDataUrl; link.download = `負能量回收證書_${detectedColor}.jpg`;
            document.body.appendChild(link); link.click(); link.remove();

            const base64Raw = imageDataUrl.split(',')[1];
            let formData = new FormData();
            formData.append("image", base64Raw);

            fetch("https://api.imgbb.com/1/upload?key=6d20715c33e4213383e69e73b357857a", {
                method: "POST",
                body: formData
            })
            .then(res => res.json())
            .then(json => {
                if (json.success) {
                    const cloudImageUrl = json.data.url;
                    if (qrContainer) {
                        qrContainer.innerHTML = ''; 
                        qrCodeInstance = new QRCode(qrContainer, {
                            text: cloudImageUrl, 
                            width: 140, height: 140, colorDark: '#000000', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M
                        });
                        if (hintText) hintText.innerHTML = "🎉 條碼生成成功！請用手機掃描上方 QR Code，即可直接在手機下載儲存整張精彩證書大圖！📱";
                    }
                } else { throw new Error(); }
            })
            .catch(err => {
                if (qrContainer) qrContainer.innerHTML = '生成失敗';
                console.error("圖床故障：", err);
            });
        });
    }

    function ensureResultEyeImages() {
        const resultPage = document.getElementById('result-page'); if (!resultPage) return;
        if (!document.getElementById('left-eye-img')) {
            const img = document.createElement('img'); img.id = 'left-eye-img'; img.className = 'eye-grow-img'; img.alt = '左眼貼圖'; resultPage.appendChild(img);
        }
        if (!document.getElementById('right-eye-img')) {
            const img = document.createElement('img'); img.id = 'right-eye-img'; img.className = 'eye-grow-img'; img.alt = '右眼貼圖'; resultPage.appendChild(img);
        }
    }

    function restoreReadyToCaptureState() {
        ensureResultEyeImages(); const lImg = document.getElementById('left-eye-img'); const rImg = document.getElementById('right-eye-img');
        lImg.src = colorPatternsBase[currentFinalColor]; rImg.src = colorPatternsBase[currentFinalColor];
        lImg.style.display = 'block'; rImg.style.display = 'block'; lImg.style.opacity = '1'; rImg.style.opacity = '1';
        currentEyeWidth = 70; lImg.style.width = '70px'; rImg.style.width = '70px';

        isShrinking = false; shrinkStartTimestamp = 0; hasCompletedSequence = true;
        startTime = performance.now() - 7000; lastTimestamp = performance.now();

        if (animationFrameId) { cancelAnimationFrame(animationFrameId); animationFrameId = null; }
        animationFrameId = requestAnimationFrame(animateImageGrowth);
    }

    function retakePhoto() {
        document.getElementById('preview-page').style.display = 'none'; document.getElementById('result-page').style.display = 'block';
        capturedPhotoDataUrl = ''; updateCameraActionButtonState(true, '拍照');
        if (!camera) {
            const CameraClass = window.Camera || Camera;
            camera = new CameraClass(videoElement, { onFrame: async () => { await faceMesh.send({ image: videoElement }); }, width: 640, height: 480 });
        }
        try { camera.start(); } catch (e) { console.error(e); }
        restoreReadyToCaptureState();
    }

    function goToPhotoPreview() {
        const cameraActionBtn = document.getElementById('camera-action-btn'); if (cameraActionBtn && cameraActionBtn.disabled) return;
        capturedPhotoDataUrl = captureCurrentFrame();
        if (camera) { try { camera.stop(); } catch(e) {} }
        if (animationFrameId) { cancelAnimationFrame(animationFrameId); animationFrameId = null; }

        const lImg = document.getElementById('left-eye-img'); const rImg = document.getElementById('right-eye-img');
        if (lImg) lImg.remove(); if (rImg) rImg.remove();
        showPreviewPage();
    }

    function goToCharacterPage() { showCharacterPage(); }

    function resetQuizToCover() {
        totalScore = 0; currentIdx = 0; scoreHistory = [];
        document.getElementById('preview-page').style.display = 'none';
        document.getElementById('character-page').style.display = 'none';
        document.getElementById('photo-result-page').style.display = 'none';
        window.location.href = "./cover.html";
    }

    window.addEventListener("DOMContentLoaded", () => { initAiCore(); });
</script>
</body>
